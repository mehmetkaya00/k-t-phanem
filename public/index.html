<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitap Takip Sistemi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .book-list {
            list-style-type: none;
            padding: 0;
        }
        .book-item {
            background: #f9f9f9;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .book-info {
            flex-grow: 1;
        }
        .book-info small {
            color: #666;
            display: block;
        }
        .delete-btn {
            background-color: #dc3545;
            width: auto;
            padding: 5px 10px;
            margin-left: 10px;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
        /* Bölümleri gizleyip göstermek için */
        .hidden {
            display: none;
        }
        .toggle-link {
            color: #007bff;
            cursor: pointer;
            text-align: center;
            display: block;
            margin-top: 10px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- GİRİŞ VE KAYIT BÖLÜMÜ -->
    <div id="authSection">
        <h1 id="authTitle">Giriş Yap</h1>
        
        <div class="form-group">
            <label>Kullanıcı Adı:</label>
            <input type="text" id="usernameInput" placeholder="Kullanıcı adınızı girin">
        </div>
        <div class="form-group">
            <label>Şifre:</label>
            <input type="password" id="passwordInput" placeholder="Şifrenizi girin">
        </div>
        
        <!-- Kayıt olurken görünecek rol seçimi -->
        <div class="form-group hidden" id="roleGroup">
            <label>Hesap Türü:</label>
            <select id="roleInput">
                <option value="user">Normal Kullanıcı</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button id="authBtn" onclick="handleAuth()">Giriş Yap</button>
        <span class="toggle-link" id="toggleAuth" onclick="toggleAuthMode()">Hesabın yok mu? Kayıt Ol</span>
    </div>


    <!-- ANA UYGULAMA BÖLÜMÜ (Giriş yaptıktan sonra görünür) -->
    <div id="appSection" class="hidden">
        <div class="header-bar">
            <div>
                <strong>Hoş geldin, <span id="currentUserName"></span></strong>
                <small id="currentUserRole" style="color:#666; display:block;"></small>
            </div>
            <button onclick="logout()" style="width: auto; background-color: #6c757d;">Çıkış Yap</button>
        </div>

        <h2>Yeni Kitap Ekle</h2>
        <div class="form-group">
            <label>Kitap Adı:</label>
            <input type="text" id="bookTitle" placeholder="Kitap adını girin">
        </div>
        <div class="form-group">
            <label>Yazar:</label>
            <input type="text" id="bookAuthor" placeholder="Yazar adını girin">
        </div>
        <button onclick="addBook()">Ekle</button>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <h2>Kitap Listesi</h2>
        <ul id="bookList" class="book-list">
            <!-- Kitaplar buraya eklenecek -->
        </ul>
    </div>

</div>

<script>
    // Giriş yapmış kullanıcının bilgilerini tutacağız
    let loggedInUser = null; 
    let isLoginMode = true; // true: Giriş modu, false: Kayıt modu

    // --- ARAYÜZ (GÖRÜNÜM) FONKSİYONLARI ---

    // Giriş/Kayıt ekranını değiştir
    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('authTitle').innerText = isLoginMode ? 'Giriş Yap' : 'Kayıt Ol';
        document.getElementById('authBtn').innerText = isLoginMode ? 'Giriş Yap' : 'Kayıt Ol';
        document.getElementById('toggleAuth').innerText = isLoginMode ? 'Hesabın yok mu? Kayıt Ol' : 'Zaten hesabın var mı? Giriş Yap';
        
        // Rol seçimi sadece kayıt olurken görünür
        if (isLoginMode) {
            document.getElementById('roleGroup').classList.add('hidden');
        } else {
            document.getElementById('roleGroup').classList.remove('hidden');
        }
    }

    // Uygulama ekranını göster/gizle
    function showApp(user) {
        loggedInUser = user;
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        
        document.getElementById('currentUserName').innerText = user.username;
        document.getElementById('currentUserRole').innerText = user.role === 'admin' ? '(Yönetici)' : '(Kullanıcı)';
        
        // Kitapları yükle
        fetchBooks();
    }

    function logout() {
        loggedInUser = null;
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('usernameInput').value = '';
        document.getElementById('passwordInput').value = '';
    }

    // --- API İSTEKLERİ (FETCH) ---

    // Kayıt/Giriş İşlemi
    async function handleAuth() {
        const username = document.getElementById('usernameInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        const role = document.getElementById('roleInput').value;

        if (!username || !password) {
            alert('Lütfen kullanıcı adı ve şifre girin.');
            return;
        }

        const endpoint = isLoginMode ? '/api/login' : '/api/register';
        const body = isLoginMode ? { username, password } : { username, password, role };

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await response.json();

            if (!response.ok) {
                alert('Hata: ' + data.error);
                return;
            }

            if (isLoginMode) {
                // Giriş başarılı
                showApp(data.user);
            } else {
                // Kayıt başarılı, giriş moduna geç
                alert('Kayıt başarılı! Şimdi giriş yapabilirsiniz.');
                toggleAuthMode();
            }
        } catch (error) {
            console.error('Bağlantı hatası:', error);
            alert('Sunucuya bağlanılamadı.');
        }
    }

    // Kitapları Getir
    async function fetchBooks() {
        try {
            // Hangi kullanıcı istek yapıyorsa bilgilerini gönderelim
            const response = await fetch(`/api/books?username=${loggedInUser.username}&role=${loggedInUser.role}`);
            const books = await response.json();
            
            const bookList = document.getElementById('bookList');
            bookList.innerHTML = ''; // Önceki listeyi temizle

            books.forEach(book => {
                const li = document.createElement('li');
                li.className = 'book-item';
                
                // Admin ise kimin eklediğini göster
                let addedByText = '';
                if (loggedInUser && loggedInUser.role === 'admin') {
                    addedByText = `<small>Ekleyen: <strong>${book.addedBy}</strong></small>`;
                }

                li.innerHTML = `
                    <div class="book-info">
                        <strong>${book.title}</strong> - ${book.author}
                        ${addedByText}
                    </div>
                    <button class="delete-btn" onclick="deleteBook(${book.id})">Sil</button>
                `;
                bookList.appendChild(li);
            });
        } catch (error) {
            console.error('Kitaplar alınırken hata oluştu:', error);
        }
    }

    // Kitap Ekle
    async function addBook() {
        const titleInput = document.getElementById('bookTitle');
        const authorInput = document.getElementById('bookAuthor');
        
        const title = titleInput.value.trim();
        const author = authorInput.value.trim();

        if (!title || !author) {
            alert('Lütfen kitap adı ve yazar girin.');
            return;
        }

        try {
            await fetch('/api/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    title: title, 
                    author: author, 
                    addedBy: loggedInUser.username // Kimin eklediğini gönder
                })
            });

            // Inputları temizle
            titleInput.value = '';
            authorInput.value = '';
            
            // Listeyi güncelle
            fetchBooks();
        } catch (error) {
            console.error('Kitap eklenirken hata oluştu:', error);
        }
    }

    // Kitap Sil
    async function deleteBook(id) {
        if (!confirm('Bu kitabı silmek istediğinize emin misiniz?')) return;

        try {
            await fetch(`/api/books/${id}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: loggedInUser.username, 
                    role: loggedInUser.role 
                })
            });
            
            // Listeyi güncelle
            fetchBooks();
        } catch (error) {
            console.error('Kitap silinirken hata oluştu:', error);
        }
    }
</script>

</body>
</html>
